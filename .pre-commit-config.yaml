repos:
  - repo: local
    hooks:
      - id: status-equality-check
        name: "status-equality-check"
        description: 强制要求读取状态时使用 is_xxx，禁止使用 == 或 != 直接判断枚举
        language: pygrep
        types: [python]
        exclude: '^src/database/'
        entry: '(==|!=)\s*\w+Status\.[A-Z0-9_]+'
      - id: message-constructor-check
        name: "message-constructor-check"
        description: 禁止使用 Message(...) 包裹消息，避免 message 注入
        language: system
        types: [python]
        entry: python3 scripts/check_message_constructor.py
