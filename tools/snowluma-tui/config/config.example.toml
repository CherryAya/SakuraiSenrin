log_dir = "~/.local/state/snowluma-tui/logs"
run_dir = "~/.local/state/snowluma-tui/run"
tick_ms = 1000

[extra_args]
xvfb = []
fluxbox = []
x11vnc = []
novnc = []
qq = []
