display = ":1"
screen = "0 1920x1080x16"
vnc_password_file = "~/.vnc/passwd"
novnc_listen_port = 6081
qq_path = "/opt/QQ/qq"
node_path = "node"
snowluma_entry = "/home/sc/download/snowluma/index.mjs"
snowluma_cwd = "/home/sc/download/snowluma"
